services:
  fraud-detection-ai-workbench-plus-max:
    build: .
    container_name: fraud-detection-ai-workbench-plus-max
    ports:
      - "8503:8503"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./src:/app/src
    environment:
      # Pass through system environment variables (highest priority)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      # Fallback to .env file if system vars not set
      - .env
    restart: unless-stopped
